<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Forge - Live CV Builder</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e08e2e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8'/%3E%3Cline x1='8' y1='13' x2='16' y2='13'/%3E%3Cline x1='8' y1='17' x2='13' y2='17'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toolbar">
    <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <span class="brand-name">CV&nbsp;Forge</span> <span class="brand-sub">live CV builder</span>
    </div>
    <div class="toolbar-actions">
        <button id="btn-undo" class="tb-btn" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 7 3 13 9 13"/><path d="M21 17a9 9 0 00-15-6.7L3 13"/></svg>
            <span class="tb-label">Undo</span>
        </button>
        <button id="btn-redo" class="tb-btn" title="Redo (Ctrl+Y)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 7 21 13 15 13"/><path d="M3 17a9 9 0 0115-6.7L21 13"/></svg>
            <span class="tb-label">Redo</span>
        </button>

        <div class="tb-overflow" id="tb-overflow">
            <button id="btn-import" class="tb-btn" title="Load a previously exported JSON file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span class="tb-label">Import</span>
            </button>
            <button id="btn-export" class="tb-btn" title="Download your CV data as JSON">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span class="tb-label">Export</span>
            </button>
            <button id="btn-reset" class="tb-btn tb-danger" title="Reset everything to the example CV">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                <span class="tb-label">Reset</span>
            </button>
        </div>

        <button id="btn-more" class="tb-btn tb-more" title="More actions" aria-label="More actions" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>

        <button id="btn-print" class="tb-btn tb-primary" title="Print / Save as PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span class="tb-label">Print / PDF</span>
        </button>
    </div>
    <input type="file" id="import-file" accept="application/json" hidden>
</div>

<div class="workspace">
    <aside class="editor" id="editor"><!-- built by app.js --></aside>

    <main class="preview" id="preview">
        <div class="cv-scale" id="cv-scale">
            <div class="cv-page" id="cv-page"><!-- built by app.js --></div>
        </div>
    </main>
</div>

<input type="file" id="photo-file" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
